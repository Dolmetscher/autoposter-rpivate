<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Autoposter — автопостинг в соцсети</title>
    <script>
      // Тема применяется до загрузки React — страница не мигает белым.
      // Значение должно совпадать с lib/theme.ts (autoposter_theme).
      (function () {
        try {
          var t = localStorage.getItem('autoposter_theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = t;
        } catch (e) { /* ignore */ }
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-Bq-schrO.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-C_bLzVLz.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
