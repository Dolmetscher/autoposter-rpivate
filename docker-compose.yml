# Лёгкий профиль для слабого сервера: 1 vCPU / 1 ГБ RAM / 10 ГБ диск.
# 2 контейнера вместо 5 (без PostgreSQL, Redis и Celery):
# SQLite + встроенный планировщик (SCHEDULER_MODE=inline).

services:
  api:
    build: ./backend
    environment:
      SCHEDULER_MODE: inline
      PORT: 8000            # внутренний порт; наружу торчит только nginx
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      # Настройки прокси Webshare для обхода блокировок Meta и Twitter:
      HTTP_PROXY: "http://ЛОГИН:ПАРОЛЬ@IP:ПОРТ"
      HTTPS_PROXY: "http://ЛОГИН:ПАРОЛЬ@IP:ПОРТ"
      NO_PROXY: "localhost,127.0.0.1"
      # предохранители слабого сервера
      MAX_MEDIA_SIZE_MB: ${MAX_MEDIA_SIZE_MB:-20}
      CROSSPOST_MAX_MEDIA_MB: ${CROSSPOST_MAX_MEDIA_MB:-15}
      MEDIA_RETENTION_DAYS: ${MEDIA_RETENTION_DAYS:-30}
      TRANSCODE_ENABLED: ${TRANSCODE_ENABLED:-false}
      # биллинг (опционально)
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      BILLING_RETURN_PATH: ${BILLING_RETURN_PATH:-/settings}
      # OAuth-ключи соцсетей
      VK_APP_ID: ${VK_APP_ID:-}
      VK_APP_SECRET: ${VK_APP_SECRET:-}
      OK_APP_ID: ${OK_APP_ID:-}
      OK_APP_SECRET: ${OK_APP_SECRET:-}
      OK_APP_PUBLIC_KEY: ${OK_APP_PUBLIC_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
    volumes:
      # Защищенный том: SQLite-база и медиафайлы не удалятся при пересборках Portainer
      - app_data:/app/data
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s

  front:
    build:
      context: .
      dockerfile: Dockerfile.front
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped
    logging: *logging

volumes:
  app_data:
