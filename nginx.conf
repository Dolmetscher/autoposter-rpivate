server {
    listen 80;
    server_name _;

    # Включаем сжатие для ускорения загрузки сайта
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 1. Раздача статики фронтенда (React/Vite)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # Если файл не найден, отдаем index.html (обязательно для работы роутинга в SPA)
        try_files $uri $uri/ /index.html;
    }

    # 2. Перенаправление запросов к API на бэкенд (контейнер api)
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Перенаправление для документации Swagger (FastAPI)
    location /docs {
        proxy_pass http://api:8000/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://api:8000/openapi.json;
        proxy_set_header Host $host;
    }
}