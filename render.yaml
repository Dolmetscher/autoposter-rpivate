# Render Blueprint: бэкенд FastAPI (free) + опционально статика фронтенда.
# Деплой: Render → New → Blueprint → выберите репозиторий.
# БД — внешний бесплатный PostgreSQL (Neon), её строка вводится в дашборде Render.
services:
  - type: web
    name: autoposter-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: DATABASE_URL
        sync: false   # строка Neon: postgresql+asyncpg://user:pass@host/db?sslmode=require
      - key: PUBLIC_BASE_URL
        sync: false   # публичный URL сервиса, напр. https://autoposter-api.onrender.com
      - key: SCHEDULER_MODE
        value: inline
      - key: SECRET_KEY
        generateValue: true
      # ключи соцсетей (необязательно, добавляются позже в дашборде):
      - key: VK_APP_ID
        sync: false
      - key: VK_APP_SECRET
        sync: false

  # Альтернатива Netlify: фронтенд как статический сайт на Render.
  # ПЕРЕД деплоем замените ВАШ-БЭКЕНД-ИМЯ.onrender.com на имя сервиса выше.
  - type: web
    name: autoposter-front
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    outputDir: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://ВАШ-БЭКЕНД-ИМЯ.onrender.com/api/:splat
      - type: rewrite
        source: /media/*
        destination: https://ВАШ-БЭКЕНД-ИМЯ.onrender.com/media/:splat
      - type: rewrite
        source: /*
        destination: /index.html
